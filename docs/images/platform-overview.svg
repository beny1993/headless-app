      <rect width="320" height="34" rx="16" fill="#b45309"/><rect y="18" width="320" height="16" fill="#b45309"/>
      <circle cx="20" cy="17" r="5" fill="#fff" opacity=".7"/><circle cx="36" cy="17" r="5" fill="#fff" opacity=".7"/><circle cx="52" cy="17" r="5" fill="#fff" opacity=".7"/>
      <text x="300" y="22" text-anchor="end" font-size="12" fill="#fff">books.example</text>
