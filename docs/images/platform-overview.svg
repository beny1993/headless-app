      <text x="300" y="22" text-anchor="end" font-size="12" fill="#fff">fashion.example</text>
      <text x="20" y="66" font-size="18" font-weight="700" fill="#1b1f24">Clothing shop</text>
      <text x="20" y="86" font-size="12" fill="#57606a">English · LTR · size × color variants</text>
      <g transform="translate(20,104)" fill="#e8eef9"><rect width="84" height="84" rx="10"/><rect x="98" width="84" height="84" rx="10"/><rect x="196" width="84" height="84" rx="10"/></g>
      <g transform="translate(20,198)" fill="#d0d7de"><rect width="60" height="8" rx="4"/><rect x="98" width="60" height="8" rx="4"/><rect x="196" width="60" height="8" rx="4"/></g>
      <g transform="translate(20,214)" fill="#1f6feb"><rect width="40" height="8" rx="4"/><rect x="98" width="40" height="8" rx="4"/><rect x="196" width="40" height="8" rx="4"/></g>
    </g>
