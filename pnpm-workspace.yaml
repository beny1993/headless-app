overrides:
  # vite 8 (via vitest) and react-email 6 want esbuild ^0.27||^0.28 while
  # tsx/drizzle-kit pull 0.25 — route every consumer to one patched esbuild.
  'esbuild@>=0.17.0 <0.28.1': ^0.28.1
  # GHSA-jqff-g426-hqxp: fast-uri <3.1.6 host confusion. Dev-only path
  # (commitlint + react-email CLI), not in the runtime bundle, but the
  # pre-push audit gate is repo-wide — pin the patched line everywhere.
  'fast-uri@>=3.0.0 <3.1.6': ^3.1.6

# pnpm 11 blocks dependency build scripts by default. Without these allows,
# install looks green but native binaries never compile.
enablePrePostScripts: true
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  unrs-resolver: true
