overrides:
  # GHSA-vfj7-8cjw-p6xm: older Sass pulls vulnerable braces via chokidar 3.
  # Sass 1.105.1 uses chokidar 5, which removes that dependency.
  'sass@<1.105.1': ^1.105.1
  # GHSA-6j4f-fj2g-mc7p (<1.1.19, <5.0.10) and GHSA-qhr7-859c-m2p7 (<1.1.20,
  # <5.0.11): brace-expansion DoS via uncontrolled recursion on nested braces.
  # GHSA-q2hr-2g5m-vwhr (<1.1.21, <5.0.12, moderate): quadratic-time expansion,
  # cleared by the same pin. 1.x arrives via eslint -> minimatch, 5.x via
  # @typescript-eslint -> minimatch and @sentry/nextjs -> its bundler plugins ->
  # glob -> minimatch: lint and build-time only, never in the runtime bundle.
  'brace-expansion@<1.1.21': ^1.1.21
  'brace-expansion@>=4.0.0 <5.0.12': ^5.0.12
  # vite 8 (via vitest) wants esbuild ^0.27||^0.28 while
  # tsx/drizzle-kit pull 0.25 — route every consumer to one patched esbuild.
  'esbuild@>=0.17.0 <0.28.1': ^0.28.1
  # GHSA-jqff-g426-hqxp: fast-uri <3.1.6 host confusion. GHSA-qw65-cvwx-89v3:
  # <3.1.7 authority injection via an unvalidated port. GHSA-58mr-gqgx-xq4g:
  # 3.1.6 itself, host confusion via an unclosed bracket. Dev path via
  # commitlint, and now also a build-time-only one via @sentry/nextjs ->
  # @sentry/webpack-plugin. Neither is in the runtime bundle, but the
  # pre-push audit gate is repo-wide — pin the patched line everywhere.
  'fast-uri@>=3.0.0 <3.1.7': ^3.1.7
  # GHSA-2883-xcg3-v3hh: js-yaml <4.3.2 unbounded CPU on empty merge keys.
  # 27 transitive paths, all tooling.
  'js-yaml@>=4.0.0 <4.3.2': ^4.3.2
  # libheif CVEs reachable through sharp <0.35.4. Arrives via
  # @sentry/nextjs -> @sentry/webpack-plugin, i.e. build-time only.
  'sharp@<0.35.4': ^0.35.4

# pnpm 11 blocks dependency build scripts by default. Without these allows,
# install looks green but native binaries never compile.
enablePrePostScripts: true
allowBuilds:
  # false because nothing uses it yet, not because it cannot be fetched.
  # Measured from the VPS: downloads.sentry-cdn.com (the binary) answers 200 and
  # only sentry.io itself answers 403, so the postinstall WOULD succeed on the
  # box — it is the source-map UPLOAD that cannot reach sentry.io, and
  # next.config.ts gates that behind SENTRY_AUTH_TOKEN anyway. Skipping the
  # download just keeps ~20 MB and a network round trip out of every install.
  # Flip to true the day source maps have a reachable target (a self-hosted
  # GlitchTip/Bugsink, or a build that runs outside Iran).
  '@sentry/cli': false
  '@tailwindcss/oxide': true
  esbuild: true
  unrs-resolver: true
